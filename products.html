<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toy Haven | Products</title>

    <meta
        name="description"
        content="Browse Toy Haven products."
    >

    <meta
        name="theme-color"
        content="#5b3df5"
    >

    <link rel="icon" href="img/favicon.svg">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="products">

    <a class="skip" href="#main">
        Skip to main content
    </a>

    <header class="site-header">

        <a class="logo" href="index.html">
            🧸 Toy Haven
        </a>

        <button
            class="burger"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <ul id="menu">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="products.html" aria-current="page">
                        Products
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart
                        <span class="badge" id="count">0</span>
                    </a>
                </li>

                <li>
                    <a href="wishlist.html">
                        Wishlist
                    </a>
                </li>

                <li>
                    <a href="checkout.html">
                        Checkout
                    </a>
                </li>

                <li>
                    <a href="feedback.html">
                        Feedback
                    </a>
                </li>

            </ul>
        </nav>
    </header>

    <main id="main" class="wrap">

        <h1>Our Products</h1>

        <div class="tools">

            <input
                id="search"
                type="search"
                placeholder="Search products..."
                aria-label="Search products"
            >

            <div id="filters"></div>

        </div>

        <p id="results"></p>

        <section
            id="grid"
            class="grid"
            aria-label="Product list"
        ></section>

    </main>

    <dialog id="modal" aria-labelledby="m-title">

        <div id="m-body"></div>

        <button
            id="m-close"
            type="button"
            class="btn"
        >
            Close
        </button>

    </dialog>

    <footer class="site-footer">

        <div>
            <h2>Toy Haven</h2>

            <p>
                Your place for toys, games and collectibles.
            </p>
        </div>

        <div>
            <h2>Quick Links</h2>

            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="cart.html">Cart</a>
                </li>

                <li>
                    <a href="feedback.html">Support</a>
                </li>
            </ul>
        </div>

        <div>
            <h2>Newsletter</h2>

            <form id="newsletter">

                <label for="nl-email">
                    Email address
                </label>

                <div class="row">
                    <input
                        id="nl-email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                    <button class="btn accent" type="submit">
                        Join
                    </button>
                </div>

                <span id="e-email" class="err"></span>

            </form>
        </div>

    </footer>

    <div id="toast" role="status"></div>

    <script src="js/app.js"></script>
</body>

</html>
